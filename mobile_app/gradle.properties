# ==============================================================================
# Never Land Server Manager - Configurações Globais do Gradle (gradle.properties)
# ==============================================================================
# Este arquivo define as propriedades de ambiente, alocação de memória e flags do
# compilador para a construção do aplicativo Android nativo Never Land.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Configuração Obrigatória do JDK 17 (Java Home)
# ------------------------------------------------------------------------------
# O Android Gradle Plugin (AGP) 8.7.3 e Kotlin 2.0.21 requerem JDK 17 ou 21.
# Na máquina de desenvolvimento Windows, a variável de usuário aponta para o JDK 26.
# A linha abaixo força o Gradle a utilizar o Eclipse Adoptium OpenJDK 17 LTS instalado,
# prevenindo falhas de incompatibilidade de versão de bytecode na JVM.
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.20.101-hotspot

# ------------------------------------------------------------------------------
# 2. Otimizações da Máquina Virtual Gradle (JVM Daemon)
# ------------------------------------------------------------------------------
# Aloca 2048 MB de memória heap para o daemon do Gradle, garantindo velocidade na
# compilação paralela do Kotlin e geração do APK sem sobrecarregar a máquina.
# Força o encoding UTF-8 para evitar problemas com caracteres e acentuação no Windows.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Habilita execução paralela de tarefas de módulos independentes
org.gradle.parallel=true

# Ativa cache de build local do Gradle para acelerar reconstruções incrementais
org.gradle.caching=true

# ------------------------------------------------------------------------------
# 3. Flags do AndroidX e Otimizações de Recursos (R Class)
# ------------------------------------------------------------------------------
# Garante o uso exclusivo das bibliotecas de suporte modernas do AndroidX
android.useAndroidX=true

# Gera classes R não transitivas para cada módulo, reduzindo significativamente o
# tamanho do APK final e o tempo de compilação em projetos Android modernos
android.nonTransitiveRClass=true

# ------------------------------------------------------------------------------
# 4. Estilo de Código e Kotlin
# ------------------------------------------------------------------------------
# Define o estilo de código oficial da JetBrains para o compilador Kotlin
kotlin.code.style=official
